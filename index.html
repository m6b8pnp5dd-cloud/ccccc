<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Color Sort Fun!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');

  :root {
    --red: #FF4B4B;
    --green: #3CC84A;
    --blue: #3B9EFF;
    --red-light: #FFD6D6;
    --green-light: #D6FFD9;
    --blue-light: #D6EEFF;
    --bg: #FFF8E7;
    --star-gold: #FFD700;
    --shadow: rgba(0,0,0,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    width: 100vw; height: 100vh;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  /* ===== SCREENS ===== */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .screen.hidden { display: none !important; }

  /* ===== START SCREEN ===== */
  #start-screen {
    background: linear-gradient(160deg, #FFF8E7 0%, #FFE9C8 100%);
    gap: 40px;
  }
  .game-title {
    font-family: 'Fredoka One', cursive;
    font-size: 72px;
    color: #FF7043;
    text-shadow: 4px 4px 0 #FFD180, 6px 6px 0 rgba(0,0,0,0.1);
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.1;
  }
  .subtitle {
    font-size: 26px; color: #888; font-weight: 700;
  }
  .level-buttons {
    display: flex; gap: 28px; flex-wrap: wrap; justify-content: center;
  }
  .level-btn {
    width: 160px; height: 160px;
    border-radius: 32px;
    border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    color: white;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.1);
    transition: transform 0.1s, box-shadow 0.1s;
    position: relative; overflow: hidden;
  }
  .level-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
  .level-btn.easy { background: linear-gradient(145deg, #56E39F, #1DB954); }
  .level-btn.medium { background: linear-gradient(145deg, #FFB347, #FF7F00); }
  .level-btn.hard { background: linear-gradient(145deg, #FF6B9D, #C0024E); }
  .stars { font-size: 28px; letter-spacing: 2px; }
  .level-label { font-size: 18px; }

  /* ===== GAME SCREEN ===== */
  #game-screen {
    background: linear-gradient(180deg, #E8F4FD 0%, #D0ECFD 40%, #C8F5D0 100%);
    flex-direction: column;
    justify-content: flex-start;
    padding: 0;
  }

  #game-header {
    width: 100%; padding: 14px 24px 8px;
    display: flex; align-items: center; gap: 16px;
    z-index: 10;
  }
  #back-btn {
    width: 52px; height: 52px; border-radius: 50%;
    border: none; background: white;
    font-size: 22px; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    display: flex; align-items: center; justify-content: center;
  }
  #level-indicator {
    font-family: 'Fredoka One', cursive;
    font-size: 22px; color: #666;
  }

  /* Demo overlay */
  #demo-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 24px;
  }
  #demo-overlay.hidden { display: none; }
  .demo-bubble {
    background: white; border-radius: 28px;
    padding: 24px 36px; max-width: 480px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .demo-bubble h2 { font-family: 'Fredoka One', cursive; font-size: 32px; color: #FF7043; margin-bottom: 8px; }
  .demo-bubble p { font-size: 20px; color: #555; line-height: 1.5; }
  #demo-start-btn {
    background: linear-gradient(145deg, #56E39F, #1DB954);
    color: white; font-family: 'Fredoka One', cursive;
    font-size: 26px; border: none; border-radius: 50px;
    padding: 16px 48px; cursor: pointer;
    box-shadow: 0 6px 0 #198042, 0 10px 20px rgba(0,0,0,0.2);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  #demo-start-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #198042; }
  .demo-arrow { font-size: 48px; animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  /* Cars area */
  #cars-area {
    flex: 1;
    position: relative;
    width: 100%;
    min-height: 0;
  }

  /* Car */
  .car {
    position: absolute;
    width: 110px; height: 70px;
    cursor: grab;
    user-select: none;
    transition: filter 0.2s;
    z-index: 5;
    touch-action: none;
  }
  .car.dragging { cursor: grabbing; z-index: 50; filter: drop-shadow(0 12px 20px rgba(0,0,0,0.3)); transform: scale(1.12); }
  .car.wrong-shake { animation: shake 0.4s; }
  .car.returning { transition: left 0.4s cubic-bezier(0.34,1.3,0.64,1), top 0.4s cubic-bezier(0.34,1.3,0.64,1); }
  @keyframes shake {
    0%,100%{transform:translateX(0) scale(1)}
    20%{transform:translateX(-12px) scale(1.05) rotate(-3deg)}
    40%{transform:translateX(12px) scale(1.05) rotate(3deg)}
    60%{transform:translateX(-8px) scale(1.05) rotate(-2deg)}
    80%{transform:translateX(8px) scale(1.05) rotate(2deg)}
  }

  /* Baskets area */
  #baskets-area {
    width: 100%;
    padding: 10px 20px 20px;
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    height: 160px;
    flex-shrink: 0;
  }

  .basket {
    width: 140px; height: 130px;
    border-radius: 12px 12px 28px 28px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 10px;
    position: relative;
    transition: transform 0.2s, filter 0.2s;
  }
  .basket.hover { transform: scale(1.08); filter: brightness(1.1); }
  .basket svg { width: 100%; height: 100%; }

  /* Win screen */
  #win-screen {
    background: linear-gradient(160deg, #FFF8E7 0%, #FFECD0 100%);
    gap: 30px;
    z-index: 200;
    animation: fadeIn 0.5s;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .win-title {
    font-family: 'Fredoka One', cursive;
    font-size: 64px; color: #FF7043;
    text-shadow: 3px 3px 0 #FFD180;
    animation: pop 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }
  .win-buttons { display: flex; gap: 32px; }
  .win-btn {
    width: 130px; height: 130px; border-radius: 30px;
    border: none; cursor: pointer;
    font-size: 52px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.1);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .win-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
  .win-btn.home { background: linear-gradient(145deg, #74C0FC, #228BE6); }
  .win-btn.next { background: linear-gradient(145deg, #69DB7C, #2F9E44); }

  /* Fireworks canvas */
  #fireworks-canvas {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 150;
  }
  #fireworks-canvas.hidden { display: none; }

  /* Coming soon badge */
  .coming-soon {
    position: absolute; bottom: -10px; right: -10px;
    background: #FF7043; color: white;
    font-size: 11px; font-weight: 900;
    padding: 4px 8px; border-radius: 10px;
    transform: rotate(10deg);
  }
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="start-screen" class="screen">
  <div class="game-title">🎨 Color<br>Sort!</div>
  <div class="subtitle">Choose a level to start!</div>
  <div class="level-buttons">
    <button class="level-btn easy" onclick="startGame(1)">
      <div class="stars">⭐</div>
      <div class="level-label">Easy</div>
    </button>
    <button class="level-btn medium" onclick="startGame(2)" style="position:relative">
      <div class="stars">⭐⭐</div>
      <div class="level-label">Medium</div>
      <div class="coming-soon">Soon!</div>
    </button>
    <button class="level-btn hard" onclick="startGame(3)" style="position:relative">
      <div class="stars">⭐⭐⭐</div>
      <div class="level-label">Hard</div>
      <div class="coming-soon">Soon!</div>
    </button>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="game-screen" class="screen hidden">
  <div id="game-header">
    <button id="back-btn" onclick="goHome()">🏠</button>
    <div id="level-indicator">⭐ Easy Level</div>
  </div>

  <!-- Demo Overlay -->
  <div id="demo-overlay">
    <div class="demo-bubble">
      <h2>🎯 How to Play!</h2>
      <p>Drag each car 🚗 to the basket with the <strong>same color</strong>!</p>
    </div>
    <div class="demo-arrow">👇</div>
    <button id="demo-start-btn" onclick="dismissDemo()">Let's Go! 🚀</button>
  </div>

  <div id="cars-area"></div>
  <div id="baskets-area"></div>
</div>

<!-- WIN SCREEN -->
<div id="win-screen" class="screen hidden">
  <div class="win-title">🎉 Amazing! 🎉</div>
  <div style="font-size:32px; color:#888; font-weight:700;">You sorted all the cars!</div>
  <div class="win-buttons">
    <button class="win-btn home" onclick="goHome()" title="Home">🏠</button>
    <button class="win-btn next" onclick="goNextLevel()" title="Next Level">▶️</button>
  </div>
</div>

<!-- Fireworks -->
<canvas id="fireworks-canvas" class="hidden"></canvas>

<script>
// ===== AUDIO ENGINE =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function getCtx() { if (!ctx) ctx = new AudioCtx(); return ctx; }

function playSuccess() {
  const a = getCtx();
  const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
  notes.forEach((freq, i) => {
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.connect(gain); gain.connect(a.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    const t = a.currentTime + i * 0.12;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.4, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    osc.start(t); osc.stop(t + 0.4);
  });
}

function playError() {
  const a = getCtx();
  [220, 180].forEach((freq, i) => {
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.connect(gain); gain.connect(a.destination);
    osc.frequency.value = freq;
    osc.type = 'sawtooth';
    const t = a.currentTime + i * 0.15;
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc.start(t); osc.stop(t + 0.25);
  });
}

function playCelebration() {
  const a = getCtx();
  const melody = [523,659,784,1047,784,659,784,1047,1319];
  const times  = [0, 0.15,0.3,0.45,0.6,0.75,0.85,0.95,1.1];
  melody.forEach((freq, i) => {
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.connect(gain); gain.connect(a.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    const t = a.currentTime + times[i];
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.4, t + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    osc.start(t); osc.stop(t + 0.4);
  });
}

// ===== GAME STATE =====
let currentLevel = 1;
let cars = []; // { el, color, origX, origY, placed }
let baskets = []; // { el, color, x, y, w, h }
let dragging = null;
let dragOffX = 0, dragOffY = 0;
let placedCount = 0;

const COLORS = ['red', 'green', 'blue'];
const COLOR_HEX = { red: '#FF4B4B', green: '#3CC84A', blue: '#3B9EFF' };
const COLOR_DARK = { red: '#CC0000', green: '#1A8A28', blue: '#0060CC' };
const COLOR_LIGHT = { red: '#FFEEEE', green: '#EEFFEE', blue: '#EEF4FF' };

// ===== CAR SVG =====
function carSVG(color) {
  const hex = COLOR_HEX[color];
  const dark = COLOR_DARK[color];
  return `<svg viewBox="0 0 110 70" xmlns="http://www.w3.org/2000/svg">
    <!-- body -->
    <rect x="5" y="28" width="100" height="30" rx="8" fill="${hex}"/>
    <!-- roof -->
    <path d="M28 28 Q32 12 42 10 L72 10 Q82 12 84 28 Z" fill="${dark}"/>
    <!-- windows -->
    <path d="M34 28 Q36 16 42 14 L56 14 L54 28 Z" fill="#CCE8FF" opacity="0.85"/>
    <path d="M57 28 L57 14 L70 14 Q78 16 80 28 Z" fill="#CCE8FF" opacity="0.85"/>
    <!-- wheels -->
    <circle cx="27" cy="56" r="12" fill="#333"/>
    <circle cx="27" cy="56" r="6" fill="#888"/>
    <circle cx="83" cy="56" r="12" fill="#333"/>
    <circle cx="83" cy="56" r="6" fill="#888"/>
    <!-- bumpers -->
    <rect x="2" y="38" width="10" height="12" rx="4" fill="${dark}"/>
    <rect x="98" y="38" width="10" height="12" rx="4" fill="${dark}"/>
    <!-- headlight -->
    <rect x="98" y="40" width="8" height="6" rx="2" fill="#FFFACD"/>
  </svg>`;
}

// ===== BASKET SVG =====
function basketSVG(color) {
  const hex = COLOR_HEX[color];
  const dark = COLOR_DARK[color];
  const light = COLOR_LIGHT[color];
  return `<svg viewBox="0 0 140 130" xmlns="http://www.w3.org/2000/svg">
    <!-- basket body -->
    <path d="M10 40 Q10 120 70 125 Q130 120 130 40 Z" fill="${hex}"/>
    <path d="M10 40 Q10 120 70 125 Q130 120 130 40 Z" fill="url(#stripe_${color})" opacity="0.18"/>
    <defs>
      <pattern id="stripe_${color}" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(45)">
        <rect width="8" height="16" fill="white"/>
      </pattern>
    </defs>
    <!-- rim -->
    <rect x="6" y="32" width="128" height="18" rx="9" fill="${dark}"/>
    <!-- handle left -->
    <path d="M30 32 Q20 10 35 8 Q50 6 45 32" fill="none" stroke="${dark}" stroke-width="8" stroke-linecap="round"/>
    <!-- handle right -->
    <path d="M110 32 Q120 10 105 8 Q90 6 95 32" fill="none" stroke="${dark}" stroke-width="8" stroke-linecap="round"/>
    <!-- shine -->
    <ellipse cx="70" cy="90" rx="30" ry="8" fill="white" opacity="0.12"/>
    <!-- label -->
    <circle cx="70" cy="75" r="20" fill="white" opacity="0.25"/>
  </svg>`;
}

// ===== INIT GAME =====
function startGame(level) {
  if (level !== 1) { alert("This level is coming soon! 🌟"); return; }
  currentLevel = level;
  cars = []; baskets = []; dragging = null; placedCount = 0;

  showScreen('game-screen');
  document.getElementById('demo-overlay').classList.remove('hidden');
  renderGame();
}

function renderGame() {
  const carsArea = document.getElementById('cars-area');
  const basketsArea = document.getElementById('baskets-area');
  carsArea.innerHTML = '';
  basketsArea.innerHTML = '';

  // Create baskets
  COLORS.forEach(color => {
    const el = document.createElement('div');
    el.className = 'basket';
    el.dataset.color = color;
    el.innerHTML = basketSVG(color);
    basketsArea.appendChild(el);
  });

  // Wait for layout then place cars
  requestAnimationFrame(() => {
    // Measure basket positions
    baskets = [];
    document.querySelectorAll('.basket').forEach(el => {
      const r = el.getBoundingClientRect();
      const ar = carsArea.getBoundingClientRect();
      baskets.push({ el, color: el.dataset.color, x: r.left, y: r.top, w: r.width, h: r.height });
    });

    // Place 12 cars (4 per color) randomly in cars area
    const ar = carsArea.getBoundingClientRect();
    const CAR_W = 110, CAR_H = 70, MARGIN = 16;

    // Generate non-overlapping positions
    const positions = [];
    const allColors = [...COLORS, ...COLORS, ...COLORS, ...COLORS]; // 4 each
    // Shuffle
    for (let i = allColors.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [allColors[i], allColors[j]] = [allColors[j], allColors[i]];
    }

    let attempts = 0;
    for (let i = 0; i < 12; i++) {
      let x, y, ok, tries = 0;
      do {
        x = MARGIN + Math.random() * (ar.width - CAR_W - MARGIN * 2);
        y = MARGIN + Math.random() * (ar.height - CAR_H - MARGIN * 2);
        ok = positions.every(p => Math.abs(p.x - x) > CAR_W + 10 || Math.abs(p.y - y) > CAR_H + 10);
        tries++;
      } while (!ok && tries < 100);
      positions.push({ x, y });
    }

    allColors.forEach((color, i) => {
      const el = document.createElement('div');
      el.className = 'car';
      el.dataset.color = color;
      el.innerHTML = carSVG(color);
      el.style.left = positions[i].x + 'px';
      el.style.top = positions[i].y + 'px';
      carsArea.appendChild(el);

      const carObj = { el, color, origX: positions[i].x, origY: positions[i].y, placed: false };
      cars.push(carObj);

      // Events
      el.addEventListener('mousedown', e => startDrag(e, carObj));
      el.addEventListener('touchstart', e => startDrag(e, carObj), { passive: false });
    });
  });
}

// ===== DRAG =====
function getEventPos(e) {
  if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function startDrag(e, carObj) {
  if (carObj.placed) return;
  if (dragging) return;
  e.preventDefault();
  getCtx(); // unlock audio

  dragging = carObj;
  const pos = getEventPos(e);
  const rect = carObj.el.getBoundingClientRect();
  dragOffX = pos.x - rect.left;
  dragOffY = pos.y - rect.top;
  carObj.el.classList.add('dragging');
  carObj.el.style.transition = '';

  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchmove', onDrag, { passive: false });
  document.addEventListener('touchend', endDrag);
}

function onDrag(e) {
  if (!dragging) return;
  e.preventDefault();
  const pos = getEventPos(e);
  const ar = document.getElementById('cars-area').getBoundingClientRect();
  const x = pos.x - ar.left - dragOffX;
  const y = pos.y - ar.top - dragOffY;
  dragging.el.style.left = x + 'px';
  dragging.el.style.top = y + 'px';

  // Highlight basket under
  const rect = dragging.el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  baskets.forEach(b => {
    const over = cx > b.x && cx < b.x + b.w && cy > b.y && cy < b.y + b.h;
    b.el.classList.toggle('hover', over);
  });
}

function endDrag(e) {
  if (!dragging) return;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
  document.removeEventListener('touchmove', onDrag);
  document.removeEventListener('touchend', endDrag);

  baskets.forEach(b => b.el.classList.remove('hover'));

  const rect = dragging.el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  let dropped = null;
  baskets.forEach(b => {
    if (cx > b.x && cx < b.x + b.w && cy > b.y && cy < b.y + b.h) dropped = b;
  });

  const car = dragging;
  dragging = null;
  car.el.classList.remove('dragging');

  if (dropped) {
    if (dropped.color === car.color) {
      // Correct!
      playSuccess();
      car.placed = true;
      car.el.style.opacity = '0.35';
      car.el.style.pointerEvents = 'none';
      // Snap to basket center
      const ar = document.getElementById('cars-area').getBoundingClientRect();
      const bCx = dropped.x + dropped.w / 2 - 55;
      const bCy = dropped.y - ar.top + dropped.h / 2 - 20;
      car.el.classList.add('returning');
      car.el.style.left = bCx + 'px';
      car.el.style.top = bCy + 'px';
      placedCount++;
      if (placedCount === cars.length) {
        setTimeout(triggerWin, 700);
      }
    } else {
      // Wrong!
      playError();
      car.el.classList.add('wrong-shake');
      car.el.classList.add('returning');
      car.el.style.left = car.origX + 'px';
      car.el.style.top = car.origY + 'px';
      setTimeout(() => {
        car.el.classList.remove('wrong-shake');
        car.el.classList.remove('returning');
      }, 500);
    }
  } else {
    // Return to original
    car.el.classList.add('returning');
    car.el.style.left = car.origX + 'px';
    car.el.style.top = car.origY + 'px';
    setTimeout(() => car.el.classList.remove('returning'), 500);
  }
}

// ===== WIN =====
function triggerWin() {
  playCelebration();
  showFireworks();
  setTimeout(() => {
    showScreen('win-screen');
    stopFireworks();
  }, 3500);
}

// ===== FIREWORKS =====
let fwAnimId = null;
let fwParticles = [];

function showFireworks() {
  const canvas = document.getElementById('fireworks-canvas');
  canvas.classList.remove('hidden');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx2 = canvas.getContext('2d');
  fwParticles = [];

  function launch() {
    const x = 100 + Math.random() * (canvas.width - 200);
    const y = 100 + Math.random() * (canvas.height * 0.5);
    const cols = ['#FF4B4B','#3CC84A','#3B9EFF','#FFD700','#FF69B4','#FF7F00'];
    const col = cols[Math.floor(Math.random() * cols.length)];
    for (let i = 0; i < 50; i++) {
      const angle = (Math.PI * 2 / 50) * i;
      const speed = 3 + Math.random() * 5;
      fwParticles.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        alpha: 1, color: col, radius: 3 + Math.random() * 2
      });
    }
  }

  let launchTimer = 0;
  function animate() {
    ctx2.clearRect(0, 0, canvas.width, canvas.height);
    launchTimer++;
    if (launchTimer % 25 === 0) launch();

    fwParticles = fwParticles.filter(p => p.alpha > 0.02);
    fwParticles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.08; // gravity
      p.alpha -= 0.018;
      ctx2.save();
      ctx2.globalAlpha = p.alpha;
      ctx2.fillStyle = p.color;
      ctx2.beginPath();
      ctx2.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx2.fill();
      ctx2.restore();
    });
    fwAnimId = requestAnimationFrame(animate);
  }
  launch(); launch();
  animate();
}

function stopFireworks() {
  cancelAnimationFrame(fwAnimId);
  document.getElementById('fireworks-canvas').classList.add('hidden');
}

// ===== NAVIGATION =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function goHome() {
  stopFireworks();
  showScreen('start-screen');
}

function goNextLevel() {
  stopFireworks();
  if (currentLevel < 3) {
    startGame(currentLevel + 1);
  } else {
    goHome();
  }
}

function dismissDemo() {
  document.getElementById('demo-overlay').classList.add('hidden');
}
</script>
</body>
